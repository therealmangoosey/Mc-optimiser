name: Repair plugin bootstrap

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Check for updates when server starts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore known-good bootstrap and add updater
        shell: bash
        run: |
          set -euo pipefail
          git checkout 74d396e731979c9d0612ae409e7f7475d36132f3 -- src/main/java/com/mc/optimizer/OptimizerPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/mc/optimizer/OptimizerPlugin.java')
          s = p.read_text()
          if 'com.mc.optimizer.update.UpdateChecker' not in s:
              s = s.replace('import com.mc.optimizer.tnt.TNTOptimizer;\n', 'import com.mc.optimizer.tnt.TNTOptimizer;\nimport com.mc.optimizer.update.UpdateChecker;\n')
          marker = '        String version = this.getDescription().getVersion();\n'
          if 'UpdateChecker.check(this);' not in s:
              s = s.replace(marker, '        UpdateChecker.check(this);\n' + marker)
          p.write_text(s)
          PY

      - name: Build repaired project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Commit repaired bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/mc/optimizer/OptimizerPlugin.java
          git commit -m "Restore working plugin bootstrap and keep startup update check [skip-release]"
          git push

      - name: Remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-plugin-main.yml
          git add -u .github/workflows/repair-plugin-main.yml
          git commit -m "Remove temporary bootstrap repair workflow [skip-release]" || true
          git push || true
