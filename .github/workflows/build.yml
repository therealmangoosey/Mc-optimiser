name: Build MCOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SKIP_RELEASE: ${{ contains(github.event.head_commit.message, '[skip-release]') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply Paper 26.2 hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new = transform(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  print(f'updated {path}')

          def replace(path, old, new):
              edit(path, lambda text: text.replace(old, new))

          # Fix EntityDistanceLimiter state restoration and decompiler import loss.
          replace('src/main/java/com/mc/optimizer/entity/distance/EntityDistanceLimiter.java',
                  'import org.bukkit.entity.LivingEntity;\n',
                  'import org.bukkit.entity.LivingEntity;\nimport org.bukkit.entity.Mob;\n')
          replace('src/main/java/com/mc/optimizer/entity/distance/EntityDistanceLimiter.java',
                  '            entity.setAI(true);\n            entity.setCollidable(true);',
                  '            entity.setAI(state.isSavedAware());\n            entity.setCollidable(true);')

          # Fix MobCullingManager reading the wrong config section.
          replace('src/main/java/com/mc/optimizer/entity/culling/MobCullingManager.java',
                  'this.plugin.getConfig().getInt("entities.culling.max-per-type." + key, 50)',
                  'this.plugin.getConfig().getInt("mob-culling.max-per-type." + key, 50)')
          replace('src/main/java/com/mc/optimizer/entity/culling/MobCullingManager.java',
                  'Collections.newSetFromMap(new ConcurrentHashMap());',
                  'Collections.newSetFromMap(new ConcurrentHashMap<UUID, Boolean>());')

          # Paper 26.2 no longer has vanilla spawn chunks and ChunkUnloadEvent is not cancellable.
          def chunk_fix(text):
              text = re.sub(r'\n            if \(this\.spawnChunkRadius <= 0\) continue;\n            this\.ensureSpawnChunksLoaded\(world\);', '', text)
              text = text.replace('if (this.isSpawnChunk(chunk) || (lastAccessed = this.lastAccessedChunks.get(key)) == null ||', 'if ((lastAccessed = this.lastAccessedChunks.get(key)) == null ||')
              text = text.replace('this.lastAccessedChunks.put(world.getName() + ":" + chunkX + ":" + chunkZ, System.currentTimeMillis() / 1000L);', 'this.lastAccessedChunks.put(world.getKey().toString() + ":" + chunkX + ":" + chunkZ, System.currentTimeMillis() / 1000L);')
              text = text.replace('return chunk.getWorld().getName() + ":" + chunk.getX() + ":" + chunk.getZ();', 'return chunk.getWorld().getKey().toString() + ":" + chunk.getX() + ":" + chunk.getZ();')
              text = re.sub(r'    @EventHandler\(priority=EventPriority\.MONITOR\)\n    public void onChunkUnload\(ChunkUnloadEvent event\) \{.*?\n    \}\n\n    @EventHandler', '''    @EventHandler(priority=EventPriority.MONITOR)
    public void onChunkUnload(ChunkUnloadEvent event) {
        if (this.config.isDebugEnabled()) {
            this.logger.fine("Chunk unloaded: " + this.getChunkKey(event.getChunk()));
        }
    }

    @EventHandler''', text, flags=re.S)
              text = text.replace('this.plugin.getConfig().getBoolean("chunks.enabled", true)', 'this.plugin.getConfig().getBoolean("chunk.enabled", true)')
              return text
          edit('src/main/java/com/mc/optimizer/chunk/ChunkManager.java', chunk_fix)

          # AFK manager: use canonical config keys and actually change/restore server view distance.
          def afk_fix(text):
              for old, new in {
                  '"afk.enabled"':'"afk-detection.enabled"',
                  '"afk.timeout-seconds"':'"afk-detection.timeout-seconds"',
                  '"afk.reduce-view-distance"':'"afk-detection.reduce-view-distance"',
                  '"afk.afk-view-distance"':'"afk-detection.afk-view-distance"',
                  '"afk.notify-players"':'"afk-detection.notify-players"',
                  '"afk.detect-no-position-change"':'"afk-detection.detect-no-position-change"',
              }.items():
                  text=text.replace(old,new)
              text=text.replace('data.setOriginalViewDistance(player.getClientViewDistance());', 'data.setOriginalViewDistance(player.getViewDistance());')
              text=text.replace('''            if (this.reduceViewDistance) {
                // empty if block
            }''', '''            if (this.reduceViewDistance) {
                player.setViewDistance(Math.max(2, Math.min(32, this.afkViewDistance)));
            }''')
              text=text.replace('''            int originalViewDistance;
            if (!this.reduceViewDistance || (originalViewDistance = data.getOriginalViewDistance()) > 0) {
                // empty if block
            }''', '''            if (this.reduceViewDistance) {
                int originalViewDistance = data.getOriginalViewDistance();
                if (originalViewDistance > 0) {
                    player.setViewDistance(originalViewDistance);
                }
            }''')
              text=re.sub(r'        int originalViewDistance;\n        UUID playerId = player.getUniqueId\(\);\n        AfkPlayerData data = this.playerData.get\(playerId\);\n        if \(data == null \|\| !data.isAfk\(\) \|\| !this.reduceViewDistance \|\| \(originalViewDistance = data.getOriginalViewDistance\(\)\) > 0\) \{\n            // empty if block\n        \}\n        this.playerData.remove\(playerId\);', '''        UUID playerId = player.getUniqueId();
        AfkPlayerData data = this.playerData.get(playerId);
        if (data != null && data.isAfk() && this.reduceViewDistance) {
            int originalViewDistance = data.getOriginalViewDistance();
            if (originalViewDistance > 0) {
                player.setViewDistance(originalViewDistance);
            }
        }
        this.playerData.remove(playerId);''', text)
              text=re.sub(r'        if \(this.reduceViewDistance\) \{\n            for \(Map.Entry<UUID, AfkPlayerData> entry : this.playerData.entrySet\(\)\) \{\n                int originalViewDistance;\n                Player player;\n                if \(entry.getValue\(\)\.isAfk\(\) && \(player = Bukkit.getPlayer\(\(UUID\)entry.getKey\(\)\)\) != null && player.isOnline\(\) && \(originalViewDistance = entry.getValue\(\)\.getOriginalViewDistance\(\)\) <= 0\) continue;\n            \}\n        \}', '''        if (this.reduceViewDistance) {
            for (Map.Entry<UUID, AfkPlayerData> entry : this.playerData.entrySet()) {
                Player player = Bukkit.getPlayer(entry.getKey());
                int originalViewDistance = entry.getValue().getOriginalViewDistance();
                if (entry.getValue().isAfk() && player != null && player.isOnline() && originalViewDistance > 0) {
                    player.setViewDistance(originalViewDistance);
                }
            }
        }''', text)
              return text
          edit('src/main/java/com/mc/optimizer/afk/AfkManager.java', afk_fix)

          # Cross-platform manager: actually honor config instead of always enabling.
          def cross_fix(text):
              text=text.replace('''        this.geyserSupport = true;
        this.floodgateCompatibility = true;
        this.bedrockOptimizations = true;
        this.plugin.getConfig().getBoolean("compatibility.cross-platform.geyser-support", true);
        this.plugin.getConfig().getBoolean("compatibility.cross-platform.floodgate-compatibility", true);
        this.plugin.getConfig().getBoolean("compatibility.cross-platform.bedrock-optimizations", true);''', '''        this.geyserSupport = this.plugin.getConfig().getBoolean("compatibility.cross-platform.geyser-support", true);
        this.floodgateCompatibility = this.plugin.getConfig().getBoolean("compatibility.cross-platform.floodgate-compatibility", true);
        this.bedrockOptimizations = this.plugin.getConfig().getBoolean("compatibility.cross-platform.bedrock-optimizations", true);''')
              text=text.replace('if (this.isBedrockPlayer(player)) {', 'if (this.bedrockOptimizations && (this.geyserLoaded || this.floodgateLoaded) && this.isBedrockPlayer(player)) {')
              text=re.sub(r'            try \{\n                Object clientViewDistance = player.getClass\(\)\.getMethod\("getViewDistance", new Class\[0\]\)\.invoke\(\(Object\)player, new Object\[0\]\);.*?            catch \(Exception clientViewDistance\) \{\n                // empty catch block\n            \}', '''            int viewDistance = player.getViewDistance();
            if (viewDistance > 8) {
                player.setViewDistance(8);
                this.logger.fine("Reduced view distance for Bedrock player " + player.getName());
            }''', text, flags=re.S)
              return text
          edit('src/main/java/com/mc/optimizer/integration/CrossPlatformManager.java', cross_fix)

          # Make memory monitoring safe for its asynchronous worker.
          def memory_fix(text):
              if 'import java.util.concurrent.ConcurrentHashMap;' not in text:
                  text=text.replace('import java.util.logging.Logger;', 'import java.util.concurrent.ConcurrentHashMap;\nimport java.util.logging.Logger;')
              if 'import java.util.Collections;' not in text:
                  text=text.replace('import java.util.ArrayList;', 'import java.util.ArrayList;\nimport java.util.Collections;')
              text=text.replace('private final List<MemorySnapshot> memoryHistory = new ArrayList<>();', 'private final List<MemorySnapshot> memoryHistory = Collections.synchronizedList(new ArrayList<>());')
              text=text.replace('private final Map<String, Long> pluginMemoryUsage = new HashMap<>();', 'private final Map<String, Long> pluginMemoryUsage = new ConcurrentHashMap<>();')
              for key in ['check-interval','detection-threshold','min-leak-threshold-mb','create-heap-dump','show-leak-sources']:
                  text=text.replace(f'"memory-leak.{key}"', f'"memory-leak-detection.{key}"')
              text=text.replace('            System.gc();', '            // Do not force a global GC from the monitoring task.')
              text=text.replace('        System.gc();', '        // Preventive monitoring should not force a global GC pause.')
              return text
          edit('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', memory_fix)

          # These modules are intentionally disabled until their behaviour can be safely implemented without bypassing Paper internals.
          def config_fix(text):
              text=text.replace('tnt-optimization:\n  enabled: true', 'tnt-optimization:\n  enabled: false')
              text=text.replace('task-optimization:\n  enabled: true', 'task-optimization:\n  enabled: false')
              text=text.replace('  smart-hoppers: true', '  smart-hoppers: false')
              text=text.replace('  pre-generate-spawn: true', '  pre-generate-spawn: false')
              return text
          edit('src/main/resources/config.yml', config_fix)

      - name: Verify Java, Gradle and version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          CONFIG_VERSION=$(sed -n 's/^# Version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' src/main/resources/config.yml | head -n 1)
          test -n "$CONFIG_VERSION"
          PROJECT_VERSION=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)
          test "$PROJECT_VERSION" = "$CONFIG_VERSION"
          echo "Version: $CONFIG_VERSION"
          echo "VERSION=$CONFIG_VERSION" >> "$GITHUB_ENV"

      - name: Build JAR
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Validate built JAR metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          EXPECTED="MCOptimizer-${VERSION}.jar"
          test "$(basename "$JAR")" = "$EXPECTED"
          cp "$JAR" "$EXPECTED"
          echo "Built: $EXPECTED"

      - name: Prepare release ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        run: |
          set -euo pipefail
          zip -r "MCOptimizer-${VERSION}.zip" \
            src \
            gradle \
            build.gradle.kts \
            settings.gradle.kts \
            gradlew \
            gradlew.bat \
            README.md \
            .gitignore

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-JAR-v${{ env.VERSION }}
          path: MCOptimizer-${{ env.VERSION }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-ZIP-v${{ env.VERSION }}
          path: MCOptimizer-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified hardening changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources/config.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Apply verified Paper 26.2 runtime hardening [skip-release]"
            git push
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          JAR="MCOptimizer-${VERSION}.jar"
          ZIP="MCOptimizer-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$ZIP" --clobber
            gh release edit "$TAG" --title "MCOptimizer v${VERSION}"
          else
            gh release create "$TAG" "$JAR" "$ZIP" \
              --title "MCOptimizer v${VERSION}" \
              --generate-notes \
              --latest
          fi
