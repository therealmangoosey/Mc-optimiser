name: Build MCOptimizer

on:
  push:
    branches: [ main, 'optimize/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SKIP_RELEASE: ${{ contains(github.event.head_commit.message, '[skip-release]') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Validate plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(sed -n 's/^# Version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' src/main/resources/config.yml | head -n 1)
          test -n "$CONFIG_VERSION"
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          EXPECTED="MCOptimizer-${CONFIG_VERSION}.jar"
          test "$(basename "$JAR")" = "$EXPECTED"
          unzip -p "$JAR" plugin.yml >/tmp/plugin.yml
          grep -q '^main: com.mc.optimizer.OptimizerPlugin$' /tmp/plugin.yml
          cp "$JAR" "$EXPECTED"
          echo "VERSION=$CONFIG_VERSION" >> "$GITHUB_ENV"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-JAR-v${{ env.VERSION }}
          path: MCOptimizer-${{ env.VERSION }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          JAR="MCOptimizer-${VERSION}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --title "MCOptimizer v${VERSION}"
          else
            gh release create "$TAG" "$JAR" --title "MCOptimizer v${VERSION}" --generate-notes --latest
          fi
