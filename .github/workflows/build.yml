name: Build MCOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java, Gradle and version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          CONFIG_VERSION=$(sed -n 's/^# Version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' src/main/resources/config.yml | head -n 1)
          test -n "$CONFIG_VERSION"
          PROJECT_VERSION=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)
          test "$PROJECT_VERSION" = "$CONFIG_VERSION" || {
            echo "Gradle project version ($PROJECT_VERSION) does not match config.yml ($CONFIG_VERSION)"
            exit 1
          }
          echo "Version: $CONFIG_VERSION"
          echo "VERSION=$CONFIG_VERSION" >> "$GITHUB_ENV"

      - name: Build JAR
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Validate built JAR metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          EXPECTED="MCOptimizer-${VERSION}.jar"
          test "$(basename "$JAR")" = "$EXPECTED" || {
            echo "Expected $EXPECTED but found $(basename "$JAR")"
            exit 1
          }
          cp "$JAR" "$EXPECTED"
          echo "Built: $EXPECTED"

      - name: Prepare release ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          zip -r "MCOptimizer-${VERSION}.zip" \
            src \
            gradle \
            build.gradle.kts \
            settings.gradle.kts \
            gradlew \
            gradlew.bat \
            README.md \
            .gitignore

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-JAR-v${{ env.VERSION }}
          path: MCOptimizer-${{ env.VERSION }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-ZIP-v${{ env.VERSION }}
          path: MCOptimizer-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          JAR="MCOptimizer-${VERSION}.jar"
          ZIP="MCOptimizer-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$ZIP" --clobber
            gh release edit "$TAG" --title "MCOptimizer v${VERSION}"
          else
            gh release create "$TAG" "$JAR" "$ZIP" \
              --title "MCOptimizer v${VERSION}" \
              --generate-notes \
              --latest
          fi
