name: Build MCOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Build JAR
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Prepare release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${GITHUB_RUN_NUMBER}"
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" "MCOptimizer-${VERSION}.jar"
          zip -r "MCOptimizer-${VERSION}.zip" src gradle build.gradle.kts settings.gradle.kts gradle.properties plugin.yml README.md 2>/dev/null || \
          zip -r "MCOptimizer-${VERSION}.zip" src gradle build.gradle.kts settings.gradle.kts gradle.properties plugin.yml README.md

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-JAR
          path: MCOptimizer-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-ZIP
          path: MCOptimizer-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.run_number }}
        run: |
          gh release create "v${VERSION}" \
            "MCOptimizer-${VERSION}.jar" \
            "MCOptimizer-${VERSION}.zip" \
            --title "MCOptimizer v${VERSION}" \
            --generate-notes
