name: Build MCOptimizer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew --no-daemon clean build

      - name: Show built JARs
        run: ls -lah build/libs/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOptimizer-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
