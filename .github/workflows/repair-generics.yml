name: Repair Decompiled Java Generics

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repair generic type information
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/main/java/com/mc/optimizer/config/ConfigManager.java": [
                  ("List exemptTypeStrings = this.config.getStringList(\"entity-distance-limit.exempt-types\");",
                   "List<String> exemptTypeStrings = this.config.getStringList(\"entity-distance-limit.exempt-types\");"),
              ],
              "src/main/java/com/mc/optimizer/entity/EntityOptimizer.java": [
                  ("List nearbyEntities = item.getNearbyEntities(this.itemMergeRadius, this.itemMergeRadius, this.itemMergeRadius);",
                   "List<Entity> nearbyEntities = item.getNearbyEntities(this.itemMergeRadius, this.itemMergeRadius, this.itemMergeRadius);"),
                  ("ArrayList<Object> chunkItems = new ArrayList<Object>();",
                   "ArrayList<Item> chunkItems = new ArrayList<Item>();"),
                  ("chunkItems.add((Item)entity);",
                   "chunkItems.add((Item)entity);"),
                  ("Item oldItem = (Item)chunkItems.get(i);",
                   "Item oldItem = chunkItems.get(i);"),
              ],
              "src/main/java/com/mc/optimizer/metrics/PerformanceMonitor.java": [
                  ("List entities = world.getEntities();",
                   "List<Entity> entities = world.getEntities();"),
                  ("for (Map.Entry<String, Object> entry : snapshot.entitiesByWorld.entrySet()) {",
                   "for (Map.Entry<String, Map<String, Integer>> entry : snapshot.entitiesByWorld.entrySet()) {"),
                  ("Map counts = (Map)entry.getValue();",
                   "Map<String, Integer> counts = entry.getValue();"),
              ],
              "src/main/java/com/mc/optimizer/entity/culling/MobCullingManager.java": [
                  ("counts.entrySet().stream().sorted(Map.Entry.comparingByValue().reversed())",
                   "counts.entrySet().stream().sorted(Map.Entry.<EntityType, Integer>comparingByValue().reversed())"),
                  ("sortedCounts.sort(Map.Entry.comparingByValue().reversed());",
                   "sortedCounts.sort(Map.Entry.<EntityType, Integer>comparingByValue().reversed());"),
                  ("for (Map.Entry entry2 : sortedCounts) {",
                   "for (Map.Entry<EntityType, Integer> entry2 : sortedCounts) {"),
                  ("EntityType type = (EntityType)entry2.getKey();",
                   "EntityType type = entry2.getKey();"),
                  ("int typeCount = (Integer)entry2.getValue();",
                   "int typeCount = entry2.getValue();"),
                  ("HashMap<EntityType, List> eligibleByType = new HashMap<EntityType, List>();",
                   "HashMap<EntityType, List<Entity>> eligibleByType = new HashMap<EntityType, List<Entity>>();"),
                  ("eligibleByType.computeIfAbsent(type, k -> new ArrayList()).add(entity);",
                   "eligibleByType.computeIfAbsent(type, k -> new ArrayList<Entity>()).add(entity);"),
                  ("for (Map.Entry entry : eligibleByType.entrySet()) {",
                   "for (Map.Entry<EntityType, List<Entity>> entry : eligibleByType.entrySet()) {"),
                  ("type = (EntityType)entry.getKey();",
                   "type = entry.getKey();"),
                  ("List eligible = (List)entry.getValue();",
                   "List<Entity> eligible = entry.getValue();"),
                  ("double d1 = e1.getLocation().distanceSquared(world.getSpawnLocation());",
                   "double d1 = e1.getLocation().distanceSquared(world.getSpawnLocation());"),
                  ("double d2 = e2.getLocation().distanceSquared(world.getSpawnLocation());",
                   "double d2 = e2.getLocation().distanceSquared(world.getSpawnLocation());"),
                  ("Entity entity = (Entity)eligible.get(i);",
                   "Entity entity = eligible.get(i);"),
                  ("for (Map.Entry entry : removed.entrySet()) {",
                   "for (Map.Entry<EntityType, Integer> entry : removed.entrySet()) {"),
                  ("sb.append(\"  \").append(((EntityType)entry.getKey()).name()).append(\": \").append(entry.getValue()).append(\"\\n\");",
                   "sb.append(\"  \").append(entry.getKey().name()).append(\": \").append(entry.getValue()).append(\"\\n\");"),
              ],
              "src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java": [
                  (".sorted(Map.Entry.comparingByValue().reversed())",
                   ".sorted(Map.Entry.<String, Long>comparingByValue().reversed())"),
                  ("HashMap topPlugins = new HashMap();",
                   "HashMap<String, String> topPlugins = new HashMap<>();"),
                  (".forEach(entry -> topPlugins.put((String)entry.getKey(), this.formatSize((Long)entry.getValue())));",
                   ".forEach(entry -> topPlugins.put(entry.getKey(), this.formatSize(entry.getValue())));"),
              ],
              "src/main/java/com/mc/optimizer/task/TaskOptimizer.java": [
                  ("List inefficientTasks = this.monitoredTasks.values().stream()",
                   "List<TaskInfo> inefficientTasks = this.monitoredTasks.values().stream()"),
                  ("List inefficientTaskList = this.monitoredTasks.values().stream()",
                   "List<Map<String, Object>> inefficientTaskList = this.monitoredTasks.values().stream()"),
              ],
              "src/main/java/com/mc/optimizer/network/NetworkOptimizer.java": [
                  ("List entities = world.getEntities();",
                   "List<Entity> entities = world.getEntities();"),
              ],
              "src/main/java/com/mc/optimizer/report/PerformanceReportManager.java": [
                  ("entityCounts.entrySet().stream().sorted(Map.Entry.comparingByValue().reversed())",
                   "entityCounts.entrySet().stream().sorted(Map.Entry.<String, Integer>comparingByValue().reversed())"),
              ],
              "src/main/java/com/mc/optimizer/commands/OptimizerCommand.java": [
                  ("entityStats.entrySet().stream().sorted(Map.Entry.comparingByValue().reversed())",
                   "entityStats.entrySet().stream().sorted(Map.Entry.<String, Integer>comparingByValue().reversed())"),
              ],
          }

          changed = []
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old != new:
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(name)

          if changed:
              print("Updated:")
              print("\n".join(changed))
          else:
              print("No generic repairs were necessary")

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix remaining decompiler generic type errors"
            git push
          fi
