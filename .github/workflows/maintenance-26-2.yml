name: One-time 26.2 compatibility repairs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply compatibility and runtime fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'updated {path}')

          edit('src/main/java/com/mc/optimizer/OptimizerPlugin.java', [
              ('"chunks.enabled"', '"chunk.enabled"'),
              ('"conflicts.auto-detect"', '"general.auto-detect-conflicts"'),
              ('"metrics.enabled"', '"general.metrics-enabled"'),
              ('"api.enabled"', '"integration-api.enabled"'),
          ])

          edit('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java', [
              ('Collections.newSetFromMap(new ConcurrentHashMap())', 'Collections.newSetFromMap(new ConcurrentHashMap<UUID, Boolean>())'),
              ('@EventHandler(priority=EventPriority.MONITOR)\n    public void onEntitySpawn(EntitySpawnEvent event)', '@EventHandler(priority=EventPriority.HIGHEST, ignoreCancelled=true)\n    public void onEntitySpawn(EntitySpawnEvent event)'),
              ('@EventHandler(priority=EventPriority.MONITOR)\n    public void onCreatureSpawn(CreatureSpawnEvent event)', '@EventHandler(priority=EventPriority.HIGHEST, ignoreCancelled=true)\n    public void onCreatureSpawn(CreatureSpawnEvent event)'),
              ('return ServerUtils.isMemoryPressureHigh();', 'return ServerUtils.isMemoryPressureHigh();'),
          ])

          edit('src/main/java/com/mc/optimizer/entity/distance/EntityDistanceLimiter.java', [
              ('"entity.distance-limiter.enabled"', '"entity-distance-limit.enabled"'),
              ('"entity.distance-limiter.full-ai-radius"', '"entity-distance-limit.full-ai-radius"'),
              ('"entity.distance-limiter.reduced-ai-radius"', '"entity-distance-limit.reduced-ai-radius"'),
              ('"entity.distance-limiter.minimal-ai-radius"', '"entity-distance-limit.minimal-ai-radius"'),
              ('"entity.distance-limiter.no-ai-radius"', '"entity-distance-limit.no-ai-radius"'),
              ('"entity.distance-limiter.exempt-named-entities"', '"entity-distance-limit.exempt-named-entities"'),
              ('this.exemptTypes = new HashSet<EntityType>();\n            this.exemptNamedEntities = this.plugin.getConfig().getBoolean("entity-distance-limit.exempt-named-entities", true);', 'this.exemptTypes = new HashSet<EntityType>(this.config.getEntityExemptTypes());\n            this.exemptNamedEntities = this.plugin.getConfig().getBoolean("entity-distance-limit.exempt-named-entities", true);'),
              ('private final LivingEntity savedTarget = null;', 'private final LivingEntity savedTarget = null;'),
          ])

          # Preserve the pre-existing Mob awareness state instead of forcing it back to true.
          p = Path('src/main/java/com/mc/optimizer/entity/distance/EntityDistanceLimiter.java')
          text = p.read_text(encoding='utf-8')
          text = text.replace('entity.setAware(true);\n            entity.setCollidable(true);\n            if (entity instanceof Creature) {\n                ((Creature)entity).setTarget(state.getSavedTarget());', 'entity.setAware(state.isSavedAware());\n            entity.setCollidable(true);\n            if (entity instanceof Creature) {\n                ((Creature)entity).setTarget(state.getSavedTarget());')
          text = text.replace('entity.setAI(true);\n        entity.setCollidable(true);', 'entity.setAI(true);\n        entity.setCollidable(true);')
          text = text.replace('private LivingEntity savedTarget = null;', 'private LivingEntity savedTarget = null;\n        private boolean savedAware = true;')
          text = text.replace('public EntityAIState(LivingEntity entity) {\n            if (entity instanceof Creature) {', 'public EntityAIState(LivingEntity entity) {\n            if (entity instanceof Mob) {\n                this.savedAware = ((Mob)entity).isAware();\n            }\n            if (entity instanceof Creature) {')
          text = text.replace('public void setSavedTarget(LivingEntity target) {\n            this.savedTarget = target;\n        }', 'public void setSavedTarget(LivingEntity target) {\n            this.savedTarget = target;\n        }\n\n        public boolean isSavedAware() {\n            return this.savedAware;\n        }')
          p.write_text(text, encoding='utf-8')

          edit('src/main/java/com/mc/optimizer/entity/culling/MobCullingManager.java', [
              ('"entities.culling.enabled"', '"mob-culling.enabled"'),
              ('"entities.culling.max-mobs-per-world"', '"mob-culling.max-mobs-per-world"'),
              ('"entities.culling.player-protection-radius"', '"mob-culling.player-protection-radius"'),
              ('"entities.culling.preserve-named-mobs"', '"mob-culling.preserve-named-mobs"'),
              ('"entities.culling.preserve-tamed-mobs"', '"mob-culling.preserve-tamed-mobs"'),
              ('"entities.culling.preserve-equipped-mobs"', '"mob-culling.preserve-equipped-mobs"'),
              ('"entities.culling.preserve-boss-mobs"', '"mob-culling.preserve-boss-mobs"'),
              ('"entities.culling.max-per-type"', '"mob-culling.max-per-type"'),
          ])

          edit('src/main/java/com/mc/optimizer/commands/OptimizerCommand.java', [
              ('"entity.mob-culling.enabled"', '"mob-culling.enabled"'),
              ('"entity.mob-culling.enabled"', '"mob-culling.enabled"'),
          ])

          # Fix redstone tick accounting and remove fake piston "chain" counting.
          edit('src/main/java/com/mc/optimizer/redstone/RedstoneOptimizer.java', [
              ('this.cleanupTask = Bukkit.getScheduler().runTaskTimer((Plugin)plugin, this::cleanupTracking, 1200L, 1200L);', 'this.cleanupTask = Bukkit.getScheduler().runTaskTimer((Plugin)plugin, this::cleanupTrackingAndResetTickCounter, 1200L, 1200L);\n            Bukkit.getScheduler().runTaskTimer((Plugin)plugin, this::resetTickCounter, 1L, 1L);'),
              ('if (this.updatesThisTick > 1000) {\n            this.updatesThisTick = 0;\n        }', 'if (this.updatesThisTick < 0) {\n            this.updatesThisTick = 0;\n        }'),
              ('private void cleanupTracking() {', 'private void cleanupTracking() {'),
          ])
          p = Path('src/main/java/com/mc/optimizer/redstone/RedstoneOptimizer.java')
          text = p.read_text(encoding='utf-8')
          marker = '    private boolean arePlayersNearby(Location location) {'
          if 'cleanupTrackingAndResetTickCounter' not in text:
              text = text.replace(marker, '    private void cleanupTrackingAndResetTickCounter() {\n        this.cleanupTracking();\n        this.resetTickCounter();\n    }\n\n' + marker)
          old_extend = '''        Block piston = event.getBlock();\n        Location pistonLoc = piston.getLocation();\n        int chainLength = this.pistonChains.getOrDefault(pistonLoc, 0) + 1;\n        this.pistonChains.put(pistonLoc, chainLength);\n        if (chainLength > this.limitPistonChainLength) {'''
          new_extend = '''        if (event.getBlocks().size() > this.limitPistonChainLength) {\n            Block piston = event.getBlock();\n            Location pistonLoc = piston.getLocation();'''
          text = text.replace(old_extend, new_extend)
          old_retract = '''        Block piston = event.getBlock();\n        Location pistonLoc = piston.getLocation();\n        int chainLength = this.pistonChains.getOrDefault(pistonLoc, 0) + 1;\n        this.pistonChains.put(pistonLoc, chainLength);\n        if (chainLength > this.limitPistonChainLength) {'''
          text = text.replace(old_retract, new_extend)
          text = text.replace('            if (this.config.isDebugEnabled()) {\n                this.logger.fine("Cancelled piston extension at " + pistonLoc.getBlockX() + "," + pistonLoc.getBlockY() + "," + pistonLoc.getBlockZ() + " (chain length: " + chainLength + ")");', '            if (this.config.isDebugEnabled()) {\n                this.logger.fine("Cancelled piston extension at " + pistonLoc.getBlockX() + "," + pistonLoc.getBlockY() + "," + pistonLoc.getBlockZ() + " (moved blocks: " + event.getBlocks().size() + ")");')
          p.write_text(text, encoding='utf-8')

          # Make config analyzer/runtime toggles use the same paths as config.yml.
          edit('src/main/java/com/mc/optimizer/OptimizerPlugin.java', [
              ('"chunks.enabled"', '"chunk.enabled"'),
              ('"entity.mob-culling.enabled"', '"mob-culling.enabled"'),
          ])

          # Disable features that are currently bookkeeping-only by default and avoid unsafe claims.
          edit('src/main/resources/config.yml', [
              ('  enabled: true\n  batch-entity-packets: true\n  prioritize-player-focus: true\n  reduce-distant-packets: true\n  compression-level: 5\n  visibility-percent: 85', '  enabled: false\n  batch-entity-packets: false\n  prioritize-player-focus: false\n  reduce-distant-packets: false\n  compression-level: 5\n  visibility-percent: 85'),
          ])

      - name: Remove one-time workflow and commit fixes
        run: |
          git rm .github/workflows/maintenance-26-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources/config.yml
          git commit -m "Harden MCOptimizer for Paper 26.2"
          git push
