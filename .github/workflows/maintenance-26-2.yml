name: One-time Paper 26.2 compatibility repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Patch compatibility issues
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new)
                  p.write_text(s, encoding='utf-8')
                  print('updated', path)

          replace('src/main/java/com/mc/optimizer/entity/distance/EntityDistanceLimiter.java',
                  'import org.bukkit.entity.LivingEntity;\n',
                  'import org.bukkit.entity.LivingEntity;\nimport org.bukkit.entity.Mob;\n')
          replace('src/main/java/com/mc/optimizer/entity/distance/EntityDistanceLimiter.java',
                  'entity.setAI(true);\n        entity.setCollidable(true);',
                  'entity.setAI(state.isSavedAware());\n        entity.setCollidable(true);')

          replace('src/main/java/com/mc/optimizer/entity/culling/MobCullingManager.java',
                  'getInt("entities.culling.max-per-type." + key, 50)',
                  'getInt("mob-culling.max-per-type." + key, 50)')
          replace('src/main/java/com/mc/optimizer/entity/culling/MobCullingManager.java',
                  'Collections.newSetFromMap(new ConcurrentHashMap());',
                  'Collections.newSetFromMap(new ConcurrentHashMap<UUID, Boolean>());')

          p = Path('src/main/java/com/mc/optimizer/entity/OptimizerPlugin.java')
          if p.exists():
              replace(str(p), '"chunks.enabled"', '"chunk.enabled"')

          # Align AFK manager with config.yml and actually change/restore server view distance.
          p = Path('src/main/java/com/mc/optimizer/afk/AfkManager.java')
          s = p.read_text(encoding='utf-8')
          for a,b in {
              '"afk.enabled"':'"afk-detection.enabled"',
              '"afk.timeout-seconds"':'"afk-detection.timeout-seconds"',
              '"afk.reduce-view-distance"':'"afk-detection.reduce-view-distance"',
              '"afk.afk-view-distance"':'"afk-detection.afk-view-distance"',
              '"afk.notify-players"':'"afk-detection.notify-players"',
              '"afk.detect-no-position-change"':'"afk-detection.detect-no-position-change"',
              'player.getClientViewDistance()':'player.getViewDistance()',
          }.items():
              s=s.replace(a,b)
          s=s.replace('''            if (this.reduceViewDistance) {
                // empty if block
            }''','''            if (this.reduceViewDistance) {
                player.setViewDistance(Math.max(2, Math.min(32, this.afkViewDistance)));
            }''')
          s=s.replace('''            int originalViewDistance;
            if (!this.reduceViewDistance || (originalViewDistance = data.getOriginalViewDistance()) > 0) {
                // empty if block
            }''','''            if (this.reduceViewDistance) {
                int originalViewDistance = data.getOriginalViewDistance();
                if (originalViewDistance > 0) {
                    player.setViewDistance(originalViewDistance);
                }
            }''')
          p.write_text(s,encoding='utf-8')

          # Cross-platform toggles: actually honor configuration.
          p=Path('src/main/java/com/mc/optimizer/integration/CrossPlatformManager.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''        this.geyserSupport = true;
        this.floodgateCompatibility = true;
        this.bedrockOptimizations = true;
        this.plugin.getConfig().getBoolean("compatibility.cross-platform.geyser-support", true);
        this.plugin.getConfig().getBoolean("compatibility.cross-platform.floodgate-compatibility", true);
        this.plugin.getConfig().getBoolean("compatibility.cross-platform.bedrock-optimizations", true);''','''        this.geyserSupport = this.plugin.getConfig().getBoolean("compatibility.cross-platform.geyser-support", true);
        this.floodgateCompatibility = this.plugin.getConfig().getBoolean("compatibility.cross-platform.floodgate-compatibility", true);
        this.bedrockOptimizations = this.plugin.getConfig().getBoolean("compatibility.cross-platform.bedrock-optimizations", true);''')
          s=s.replace('''            try {
                Object clientViewDistance = player.getClass().getMethod("getViewDistance", new Class[0]).invoke((Object)player, new Object[0]);
                if (clientViewDistance instanceof Integer && (Integer)clientViewDistance > 8) {
                    player.getClass().getMethod("setViewDistance", Integer.TYPE).invoke((Object)player, 8);
                    this.logger.fine("Reduced view distance for Bedrock player " + player.getName());
                }
            }
            catch (Exception clientViewDistance) {
                // empty catch block
            }''','''            int viewDistance = player.getViewDistance();
            if (viewDistance > 8) {
                player.setViewDistance(8);
                this.logger.fine("Reduced view distance for Bedrock player " + player.getName());
            }''')
          p.write_text(s,encoding='utf-8')

          # Memory monitor: use canonical configuration names and thread-safe state.
          p=Path('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java')
          s=p.read_text(encoding='utf-8')
          if 'import java.util.Collections;' not in s: s=s.replace('import java.util.ArrayList;','import java.util.ArrayList;\nimport java.util.Collections;')
          if 'import java.util.concurrent.ConcurrentHashMap;' not in s: s=s.replace('import java.util.logging.Logger;','import java.util.concurrent.ConcurrentHashMap;\nimport java.util.logging.Logger;')
          s=s.replace('private final List<MemorySnapshot> memoryHistory = new ArrayList<>();','private final List<MemorySnapshot> memoryHistory = Collections.synchronizedList(new ArrayList<>());')
          s=s.replace('private final Map<String, Long> pluginMemoryUsage = new HashMap<>();','private final Map<String, Long> pluginMemoryUsage = new ConcurrentHashMap<>();')
          for key in ['check-interval','detection-threshold','min-leak-threshold-mb','create-heap-dump','show-leak-sources']:
              s=s.replace(f'"memory-leak.{key}"',f'"memory-leak-detection.{key}"')
          s=s.replace('System.gc();','// Do not force a global GC pause from the monitoring thread.')
          p.write_text(s,encoding='utf-8')

          # These implementations are currently monitoring-only or too invasive; keep safe defaults.
          p=Path('src/main/resources/config.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('tnt-optimization:\n  enabled: true','tnt-optimization:\n  enabled: false')
          s=s.replace('task-optimization:\n  enabled: true','task-optimization:\n  enabled: false')
          s=s.replace('  smart-hoppers: true','  smart-hoppers: false')
          s=s.replace('  pre-generate-spawn: true','  pre-generate-spawn: false')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify and build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Commit verified fixes and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources/config.yml
          git rm .github/workflows/maintenance-26-2.yml
          git commit -m "Harden MCOptimizer for Paper 26.2 [skip-release]"
          git push
