name: One-time Paper 26.2 hardening

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')
              print(f'updated {path}')

          # Chunk system: Paper 26.2 has no vanilla spawn-chunk concept.
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            this.unloadUnusedChunks(world, currentTime);\n            if (this.spawnChunkRadius <= 0) continue;\n            this.ensureSpawnChunksLoaded(world);',
                  '            this.unloadUnusedChunks(world, currentTime);')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            if (this.isSpawnChunk(chunk) || (lastAccessed = this.lastAccessedChunks.get(key)) == null || currentTime - lastAccessed <= (long)this.unloadAfterSeconds || !this.isChunkSafeToUnload(chunk)) continue;',
                  '            if ((lastAccessed = this.lastAccessedChunks.get(key)) == null || currentTime - lastAccessed <= (long)this.unloadAfterSeconds || !this.isChunkSafeToUnload(chunk)) continue;')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            this.lastAccessedChunks.put(world.getName() + ":" + chunkX + ":" + chunkZ, System.currentTimeMillis() / 1000L);',
                  '            this.lastAccessedChunks.put(world.getKey().toString() + ":" + chunkX + ":" + chunkZ, System.currentTimeMillis() / 1000L);')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '        return chunk.getWorld().getName() + ":" + chunk.getX() + ":" + chunk.getZ();',
                  '        return chunk.getWorld().getKey().toString() + ":" + chunk.getX() + ":" + chunk.getZ();')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            try {\n                    Method setCancelledMethod = event.getClass().getMethod("setCancelled", Boolean.TYPE);\n                    setCancelledMethod.invoke((Object)event, true);\n                }\n                catch (Exception e) {\n                    if (!this.config.isDebugEnabled()) break block5;\n                    this.logger.warning("Cannot cancel chunk unload in this version: " + e.getMessage());\n                }',
                  '            // ChunkUnloadEvent is not cancellable on modern Paper; do not use reflection here.')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            if (!this.config.isDebugEnabled()) break block5;\n                    this.logger.warning("Cannot cancel chunk unload in this version: " + e.getMessage());',
                  '            if (!this.config.isDebugEnabled()) continue;\n                    this.logger.warning("Chunk unload could not be prevented because Paper 26.2 does not expose a cancellable ChunkUnloadEvent.");')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            block5: {\n',
                  '')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  '            }\n            if (this.config.isDebugEnabled()) {\n                this.logger.fine("Prevented unload of high-activity chunk: " + key);\n            }\n            return;\n        }',
                  '            if (this.config.isDebugEnabled()) {\n                this.logger.fine("High-activity chunk unload request observed: " + key);\n            }\n        }')
          replace('src/main/java/com/mc/optimizer/chunk/ChunkManager.java',
                  'return this.plugin.getConfig().getBoolean("chunks.enabled", true);',
                  'return this.plugin.getConfig().getBoolean("chunk.enabled", true);')

          # Entity system: canonical keys and farm protection / state restoration.
          replace('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java',
                  'return this.plugin.getConfig().getBoolean("entities.enabled", true);',
                  'return this.plugin.getConfig().getBoolean("entity.enabled", true);')
          replace('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java',
                  'return this.plugin.getConfig().getBoolean("debug", false);',
                  'return this.plugin.getConfig().getBoolean("general.debug", false);')
          replace('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java',
                  '        if (entity.getCustomName() != null) {\n            return false;\n        }',
                  '        if (entity.getCustomName() != null || this.isFarmProtected(entity)) {\n            return false;\n        }')
          marker = '    private void cleanupTrackingData() {'
          farm = '''    private boolean isFarmProtected(Entity entity) {
        if (!this.plugin.getConfig().getBoolean("entity.farm-protection.enabled", true)) {
            return false;
        }
        double radius = Math.max(0.0, this.plugin.getConfig().getDouble("entity.farm-protection.farm-detection-radius", 16.0));
        for (Entity nearby : entity.getNearbyEntities(radius, radius, radius)) {
            String type = nearby.getType().name();
            for (String protectedType : this.plugin.getConfig().getStringList("entity.farm-protection.protected-farm-mobs")) {
                if (type.equalsIgnoreCase(protectedType)) {
                    return true;
                }
            }
        }
        return false;
    }

'''
          epath=Path('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java')
          etext=epath.read_text(encoding='utf-8')
          if 'private boolean isFarmProtected(Entity entity)' not in etext:
              etext=etext.replace(marker,farm+marker)
          etext=etext.replace('        mob.setAware(false);', '        mob.setAware(false);')
          epath.write_text(etext,encoding='utf-8')

          # Track original Mob awareness so restoration does not change server state.
          replace('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java',
                  '    private final Set<UUID> limitedAIMobs = Collections.newSetFromMap(new ConcurrentHashMap<UUID, Boolean>());',
                  '    private final Set<UUID> limitedAIMobs = Collections.newSetFromMap(new ConcurrentHashMap<UUID, Boolean>());\n    private final Map<UUID, Boolean> originalMobAwareness = new ConcurrentHashMap<UUID, Boolean>();')
          replace('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java',
                  '            this.limitMobAI(mob);\n            this.limitedAIMobs.add(mob.getUniqueId());',
                  '            this.originalMobAwareness.put(mob.getUniqueId(), mob.isAware());\n            this.limitMobAI(mob);\n            this.limitedAIMobs.add(mob.getUniqueId());')
          replace('src/main/java/com/mc/optimizer/entity/EntityOptimizer.java',
                  '    private void restoreMobAI(Mob mob) {\n        mob.setAware(true);',
                  '    private void restoreMobAI(Mob mob) {\n        mob.setAware(this.originalMobAwareness.getOrDefault(mob.getUniqueId(), true));\n        this.originalMobAwareness.remove(mob.getUniqueId());')

          # AFK: use the actual server-side view distance API and canonical config keys.
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '"afk.enabled"', '"afk-detection.enabled"')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '"afk.timeout-seconds"', '"afk-detection.timeout-seconds"')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '"afk.reduce-view-distance"', '"afk-detection.reduce-view-distance"')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '"afk.afk-view-distance"', '"afk-detection.afk-view-distance"')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '"afk.notify-players"', '"afk-detection.notify-players"')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '"afk.detect-no-position-change"', '"afk-detection.detect-no-position-change"')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', 'data.setOriginalViewDistance(player.getClientViewDistance());', 'data.setOriginalViewDistance(player.getViewDistance());')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '            if (this.reduceViewDistance) {\n                // empty if block\n            }', '            if (this.reduceViewDistance) {\n                player.setViewDistance(Math.max(2, Math.min(32, this.afkViewDistance)));\n            }')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '            int originalViewDistance;\n            if (!this.reduceViewDistance || (originalViewDistance = data.getOriginalViewDistance()) > 0) {\n                // empty if block\n            }', '            int originalViewDistance = data.getOriginalViewDistance();\n            if (this.reduceViewDistance && originalViewDistance > 0) {\n                player.setViewDistance(originalViewDistance);\n            }')
          replace('src/main/java/com/mc/optimizer/afk/AfkManager.java', '        int originalViewDistance;\n        UUID playerId = player.getUniqueId();\n        AfkPlayerData data = this.playerData.get(playerId);\n        if (data == null || !data.isAfk() || !this.reduceViewDistance || (originalViewDistance = data.getOriginalViewDistance()) > 0) {\n            // empty if block\n        }\n        this.playerData.remove(playerId);', '        UUID playerId = player.getUniqueId();\n        AfkPlayerData data = this.playerData.get(playerId);\n        if (data != null && data.isAfk() && this.reduceViewDistance) {\n            int originalViewDistance = data.getOriginalViewDistance();\n            if (originalViewDistance > 0) {\n                player.setViewDistance(originalViewDistance);\n            }\n        }\n        this.playerData.remove(playerId);')
          replace('        if (this.reduceViewDistance) {\n            for (Map.Entry<UUID, AfkPlayerData> entry : this.playerData.entrySet()) {\n                int originalViewDistance;\n                Player player;\n                if (entry.getValue().isAfk() && (player = Bukkit.getPlayer((UUID)entry.getKey())) != null && player.isOnline() && (originalViewDistance = entry.getValue().getOriginalViewDistance()) <= 0) continue;\n            }\n        }', '        if (this.reduceViewDistance) {\n            for (Map.Entry<UUID, AfkPlayerData> entry : this.playerData.entrySet()) {\n                Player player = Bukkit.getPlayer(entry.getKey());\n                int originalViewDistance = entry.getValue().getOriginalViewDistance();\n                if (entry.getValue().isAfk() && player != null && player.isOnline() && originalViewDistance > 0) {\n                    player.setViewDistance(originalViewDistance);\n                }\n            }\n        }')

          # Memory detector: canonical keys and thread-safe collections; no forced GC from an async monitor.
          replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', 'import java.util.ArrayList;', 'import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.concurrent.ConcurrentHashMap;')
          replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', 'private final List<MemorySnapshot> memoryHistory = new ArrayList<>();', 'private final List<MemorySnapshot> memoryHistory = Collections.synchronizedList(new ArrayList<>());')
          replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', 'private final Map<String, Long> pluginMemoryUsage = new HashMap<>();', 'private final Map<String, Long> pluginMemoryUsage = new ConcurrentHashMap<>();')
          for key in ['check-interval','detection-threshold','min-leak-threshold-mb','create-heap-dump','show-leak-sources']:
              replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', f'"memory-leak.{key}"', f'"memory-leak-detection.{key}"')
          replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', '            System.gc();', '            // Do not force a global GC from the asynchronous monitor task.')
          replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', '        System.gc();', '        // Preventive monitoring should not force a global GC pause.')
          replace('src/main/java/com/mc/optimizer/memory/MemoryLeakDetector.java', '    public List<MemorySnapshot> getMemoryHistory() {\n        return new ArrayList<>(this.memoryHistory);\n    }', '    public List<MemorySnapshot> getMemoryHistory() {\n        synchronized (this.memoryHistory) {\n            return new ArrayList<>(this.memoryHistory);\n        }\n    }')

          # Cross-platform support: make config flags real and use Paper API directly.
          replace('src/main/java/com/mc/optimizer/integration/CrossPlatformManager.java', '        this.geyserSupport = true;\n        this.floodgateCompatibility = true;\n        this.bedrockOptimizations = true;\n        this.plugin.getConfig().getBoolean("compatibility.cross-platform.geyser-support", true);\n        this.plugin.getConfig().getBoolean("compatibility.cross-platform.floodgate-compatibility", true);\n        this.plugin.getConfig().getBoolean("compatibility.cross-platform.bedrock-optimizations", true);', '        this.geyserSupport = this.plugin.getConfig().getBoolean("compatibility.cross-platform.geyser-support", true);\n        this.floodgateCompatibility = this.plugin.getConfig().getBoolean("compatibility.cross-platform.floodgate-compatibility", true);\n        this.bedrockOptimizations = this.plugin.getConfig().getBoolean("compatibility.cross-platform.bedrock-optimizations", true);')
          replace('src/main/java/com/mc/optimizer/integration/CrossPlatformManager.java', '        if (this.isBedrockPlayer(player)) {', '        if (this.bedrockOptimizations && (this.geyserLoaded || this.floodgateLoaded) && this.isBedrockPlayer(player)) {')
          old='''            try {\n                Object clientViewDistance = player.getClass().getMethod("getViewDistance", new Class[0]).invoke((Object)player, new Object[0]);\n                if (clientViewDistance instanceof Integer && (Integer)clientViewDistance > 8) {\n                    player.getClass().getMethod("setViewDistance", Integer.TYPE).invoke((Object)player, 8);\n                    this.logger.fine("Reduced view distance for Bedrock player " + player.getName());\n                }\n            }\n            catch (Exception clientViewDistance) {\n                // empty catch block\n            }'''
          new='''            int viewDistance = player.getViewDistance();\n            if (viewDistance > 8) {\n                player.setViewDistance(8);\n                this.logger.fine("Reduced view distance for Bedrock player " + player.getName());\n            }'''
          replace('src/main/java/com/mc/optimizer/integration/CrossPlatformManager.java', old, new)

          # Network optimization: use Paper tracking events instead of scanning every entity in a world.
          p=Path('src/main/java/com/mc/optimizer/network/NetworkOptimizer.java')
          text=p.read_text(encoding='utf-8')
          text=text.replace('import com.mc.optimizer.config.ConfigManager;\n', 'import com.mc.optimizer.config.ConfigManager;\nimport io.papermc.paper.event.player.PlayerTrackEntityEvent;\nimport io.papermc.paper.event.player.PlayerUntrackEntityEvent;\n')
          text=text.replace('        this.startUpdateTask();\n        this.startPlayerMonitorTask();', '        this.startPlayerMonitorTask();')
          insert='''    @EventHandler(priority=EventPriority.NORMAL, ignoreCancelled=true)\n    public void onPlayerTrackEntity(PlayerTrackEntityEvent event) {\n        if (!this.enabled) return;\n        Player player = event.getPlayer();\n        Entity entity = event.getEntity();\n        PlayerPacketInfo info = this.playerInfo.computeIfAbsent(player.getUniqueId(), PlayerPacketInfo::new);\n        if (entity instanceof Player) {\n            info.getVisibleEntities().add(entity.getUniqueId());\n            return;\n        }\n        if (!this.shouldTrackEntity(player, info, entity)) {\n            event.setCancelled(true);\n            return;\n        }\n        info.getVisibleEntities().add(entity.getUniqueId());\n    }\n\n    @EventHandler(priority=EventPriority.MONITOR, ignoreCancelled=true)\n    public void onPlayerUntrackEntity(PlayerUntrackEntityEvent event) {\n        PlayerPacketInfo info = this.playerInfo.get(event.getPlayer().getUniqueId());\n        if (info != null) info.getVisibleEntities().remove(event.getEntity().getUniqueId());\n    }\n\n    private boolean shouldTrackEntity(Player player, PlayerPacketInfo info, Entity entity) {\n        double distance = entity.getLocation().distance(player.getLocation());\n        if (distance <= 16.0) return true;\n        if (this.reduceDistantPackets) {\n            int viewDistance = Math.max(2, player.getViewDistance());\n            double maxDistance = viewDistance * 16.0 * (Math.max(1, Math.min(100, this.visibilityPercent)) / 100.0);\n            if (distance > maxDistance) return false;\n        }\n        if (this.prioritizePlayerFocus) {\n            Vector direction = info.getFocusDirection();\n            Vector toEntity = entity.getLocation().toVector().subtract(player.getLocation().toVector());\n            if (toEntity.lengthSquared() > 0.0 && direction.dot(toEntity.normalize()) < -0.5) return false;\n        }\n        return true;\n    }\n\n'''
          text=text.replace('    @EventHandler(priority=EventPriority.MONITOR, ignoreCancelled=true)\n    public void onPlayerJoin', insert+'    @EventHandler(priority=EventPriority.MONITOR, ignoreCancelled=true)\n    public void onPlayerJoin')
          p.write_text(text,encoding='utf-8')

          # Redstone: fix missing helper, store/cancel reset task, and do not scan every block for fake hopper optimization.
          p=Path('src/main/java/com/mc/optimizer/redstone/RedstoneOptimizer.java')
          text=p.read_text(encoding='utf-8')
          text=text.replace('    private BukkitTask cleanupTask;\n    private BukkitTask hopperCheckTask;', '    private BukkitTask cleanupTask;\n    private BukkitTask hopperCheckTask;\n    private BukkitTask tickResetTask;')
          text=text.replace('            Bukkit.getScheduler().runTaskTimer((Plugin)plugin, this::resetTickCounter, 1L, 1L);', '            this.tickResetTask = Bukkit.getScheduler().runTaskTimer((Plugin)plugin, this::resetTickCounter, 1L, 1L);')
          text=text.replace('    private boolean arePlayersNearby(Location location) {', '    private void cleanupTrackingAndResetTickCounter() {\n        this.cleanupTracking();\n        this.resetTickCounter();\n    }\n\n    private boolean arePlayersNearby(Location location) {')
          text=text.replace('Collections.newSetFromMap(new ConcurrentHashMap())', 'Collections.newSetFromMap(new ConcurrentHashMap<Location, Boolean>())')
          text=text.replace('        for (World world : Bukkit.getWorlds()) {\n            for (Chunk chunk : world.getLoadedChunks()) {\n                this.optimizeHoppersInChunk(chunk);\n            }\n        }', '        // Hopper internals are managed by Paper; this module only tracks optional hotspots.\n        // Avoid scanning every block in every loaded chunk because that creates significant main-thread work.')
          text=text.replace('            if (activityLevel > 10) {\n                power = 3.0f;\n            } else if (activityLevel > 20) {\n                power = 2.0f;', '            if (activityLevel > 20) {\n                power = 2.0f;\n            } else if (activityLevel > 10) {\n                power = 3.0f;')
          p.write_text(text,encoding='utf-8')

          # TNT: correct unreachable thresholds; queue bypass is handled by disabling this optional subsystem by default below.
          replace('src/main/java/com/mc/optimizer/tnt/TNTOptimizer.java', '            if (activityLevel > 10) {\n                power = 3.0f;\n            } else if (activityLevel > 20) {\n                power = 2.0f;', '            if (activityLevel > 30) {\n                power = 1.0f;\n            } else if (activityLevel > 20) {\n                power = 2.0f;\n            } else if (activityLevel > 10) {\n                power = 3.0f;')
          replace('src/main/java/com/mc/optimizer/tnt/TNTOptimizer.java', '        if (activityLevel > 10) {\n            reductionFactor = 0.75f;\n        } else if (activityLevel > 20) {\n            reductionFactor = 0.5f;\n        } else if (activityLevel > 30) {\n            reductionFactor = 0.25f;', '        if (activityLevel > 30) {\n            reductionFactor = 0.25f;\n        } else if (activityLevel > 20) {\n            reductionFactor = 0.5f;\n        } else if (activityLevel > 10) {\n            reductionFactor = 0.75f;')

          # Stress-test safety and generic type.
          replace('src/main/java/com/mc/optimizer/stress/StressTestManager.java', '        return this.allowInProduction || Bukkit.getServer().getWorldType().equals("FLAT");', '        return this.allowInProduction;')
          replace('src/main/java/com/mc/optimizer/stress/StressTestManager.java', '        final HashMap originalBlocks = new HashMap();', '        final Map<Location, Material> originalBlocks = new HashMap<>();')

          # Safe defaults for subsystems whose current implementation is bookkeeping-only or destructive.
          replace('src/main/resources/config.yml', '  pre-generate-spawn: true', '  pre-generate-spawn: false')
          replace('src/main/resources/config.yml', '  smart-hoppers: true', '  smart-hoppers: false')
          replace('src/main/resources/config.yml', '  enabled: true\n  monitor-other-plugins: true\n  warn-inefficient: true\n  warn-inefficient-tasks: true\n  min-task-time-ms: 5\n  max-tasks-in-report: 20', '  enabled: false\n  monitor-other-plugins: true\n  warn-inefficient: true\n  warn-inefficient-tasks: true\n  min-task-time-ms: 5\n  max-tasks-in-report: 20')
          replace('src/main/resources/config.yml', 'tnt-optimization:\n  enabled: true', 'tnt-optimization:\n  enabled: false')
          # Remove duplicate legacy sections from the default config to avoid conflicting sources of truth.
          p=Path('src/main/resources/config.yml')
          text=p.read_text(encoding='utf-8')
          import re
          text=re.sub(r'\nnetwork:\n(?:  .*\n)+?(?=\nafk-detection:)', '\n', text)
          text=re.sub(r'\nmemory-leak:\n(?:  .*\n)+?(?=\nentity-distance-limit:)', '\n', text)
          text=re.sub(r'\nafk:\n(?:  .*\n)+?(?=\nstress-test:)', '\n', text)
          p.write_text(text,encoding='utf-8')

      - name: Build before commit
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-26-2.yml
          git add src/main/java src/main/resources/config.yml
          git commit -m "Harden MCOptimizer for Paper 26.2 [skip-release]"
          git push
