# MCOptimizer Configuration
# Version: 1.2.2

general:
  debug: false
  performance-reports: true
  monitor-interval: 60
  prefix: "&6[MCOptimizer] &r"
  metrics: true
  metrics-enabled: true
  auto-detect-conflicts: true
  excluded-plugins: []
  reload-command-enabled: true

chunk:
  enabled: true
  pre-generate-spawn: true
  max-chunks-per-tick: 10
  spawn-chunk-radius: 8
  player-chunk-radius: 6
  ticking-radius: 4
  unload-dynamically: true
  unload-delay: 30
  optimize-world-saving: true
  world-save-interval: 300
  max-view-distance: -1
  prioritize-player-chunks: true
  throttle-chunk-generation: true
  respect-essential-chunks: true

entity:
  enabled: true
  activation-range: 32
  optimize-ai: true
  optimize-pathfinding: true
  max-mobs-per-chunk: 25
  despawn-range: 128
  reduce-mob-spawns: true
  mob-spawn-factor: 0.8
  merge-items: true
  smart-xp-merge: true
  max-entities-per-chunk: 25
  max-items-per-chunk: 20
  check-interval-ticks: 100
  item-merge-radius: 2.5
  limit-distant-mob-ai: true
  distant-mob-threshold: 48
  accelerated-item-despawn: true
  farm-protection:
    enabled: true
    protect-villagers: true
    protect-farm-areas: true
    farm-detection-radius: 16
    protected-farm-mobs:
      - VILLAGER
      - IRON_GOLEM
      - ZOMBIE_VILLAGER

mob-culling:
  enabled: true
  interval-ticks: 600
  intelligent-culling: true
  prioritize-lagging-entities: true
  max-mobs-per-player: 20
  exclude-bosses: true
  exclude-named-mobs: true
  max-mobs-per-world: 800
  max-per-type:
    zombie: 70
    skeleton: 70
    creeper: 50
    spider: 50
    enderman: 30
    slime: 20
    phantom: 15
  player-protection-radius: 64
  preserve-named-mobs: true
  preserve-tamed-mobs: true
  preserve-equipped-mobs: true
  preserve-boss-mobs: true

redstone:
  enabled: true
  limit-redstone-clock: true
  max-tick-rate: 10
  detect-redstone-clock: true
  max-replace-count: 100
  disable-in-unused-chunks: true
  exempt-radius: 8
  max-updates-per-tick: 100
  disable-when-no-players-nearby: true
  nearby-distance: 64
  limit-piston-chain-length: 12
  smart-hoppers: true

physics:
  enabled: true
  max-falling-blocks-per-tick: 20
  optimize-liquid-flow: true
  physics-range: 48
  adaptive-throttling: true

performance-monitor:
  enabled: true
  interval-seconds: 30
  auto-warn-threshold: true
  tps-warn-threshold: 16.0
  notify-admins: true
  log-to-console: true
  broadcast-warnings: false
monitor:
  enabled: true
  history-size: 30
  track-tps: true
  track-memory: true
  track-entities: true
  track-chunks: true
  track-redstone: true
  tps-alert-threshold: 16.0
  alert-methods:
    console: true
    chat: true
    actionbar: false

anti-lag:
  enabled: true
  threshold-tps: 17.0
  actions:
    clear-items: true
    clear-mobs: true
    disable-mob-spawning: true
    disable-mob-ai: true
    suspend-redstone: true
    suggest-gc: true

compatibility:
  auto-detect-conflicts: true
  excluded-plugins: []
  respect-protection-plugins: true
  use-plugin-hooks: true
  cross-platform:
    geyser-support: true
    floodgate-compatibility: true
    bedrock-optimizations: true

config-analyzer:
  enabled: true
  analyze-server-properties: true
  analyze-bukkit-yml: true
  analyze-spigot-yml: true
  # Current Paper uses config/paper-global.yml and paper-world-defaults.yml,
  # not the old single paper.yml format.
  analyze-paper-yml: false
  apply-changes: false
  create-backups: true

memory-leak:
  enabled: true
  check-interval: 15
  detection-threshold: 3
  min-leak-threshold-mb: 50
  create-heap-dump: false
  show-leak-sources: true
memory-leak-detection:
  enabled: true
  check-interval: 15
  leak-threshold-mb: 50
  high-memory-alerts: true
  high-memory-threshold-percent: 80
  dump-heap-on-leak: false
  show-leak-sources: true

entity-distance-limit:
  enabled: true
  full-ai-radius: 32
  reduced-ai-radius: 64
  minimal-ai-radius: 96
  no-ai-radius: 128
  exempt-types:
    - ENDER_DRAGON
    - WITHER
    - VILLAGER
  exempt-named-entities: true

tnt-optimization:
  enabled: true
  max-tnt-per-tick: 10
  batch-physics-updates: true
  max-explosions-per-tick: 5
  dynamic-explosion-scaling: true
  optimize-particles: true

task-optimization:
  enabled: true
  monitor-other-plugins: true
  warn-inefficient: true
  warn-inefficient-tasks: true
  min-task-time-ms: 5
  max-tasks-in-report: 20

network-optimization:
  enabled: false
  batch-entity-packets: false
  prioritize-player-focus: false
  reduce-distant-packets: false
  compression-level: 5
  visibility-percent: 85
network:
  enabled: false
  batch-entity-packets: false
  prioritize-player-focus: false
  reduce-distant-packets: false
  compression-level: 5
  visibility-percent: 85

afk-detection:
  enabled: true
  timeout-seconds: 300
  afk-timeout-seconds: 300
  reduce-view-distance: true
  afk-view-distance: 4
  notify-players: true
  detect-no-position-change: true

stress-test:
  enabled: false
  require-op: true
  max-test-entities: 500
  max-test-blocks: 1000
  allow-in-production: false
  auto-cleanup: true

performance-reports:
  enabled: true
  auto-generate: true
  interval-minutes: 60
  report-interval: 60
  history-days: 7
  include-plugin-metrics: true
  export-to-web: false
  max-reports: 30

lag-prediction:
  enabled: true
  interval: 30
  data-points: 60
  tps-threshold: 18.0
  cpu-threshold: 0.8
  memory-threshold: 2048
  notify-admins: true
  auto-tune: false
  # Legacy embedded web interface is intentionally disabled.
  web-interface:
    enabled: false
    port: 8080
    bind-address: "127.0.0.1"
    access-token: ""

integration-api:
  enabled: true
  log-registrations: true
  allow-custom-optimizers: true
  allow-metrics-access: true
  default-access-level: 1
