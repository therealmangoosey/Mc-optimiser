# MCOptimizer Configuration
# Version: 1.2.3

# Keep the defaults conservative: the plugin should reduce server work, not
# replace vanilla/Paper systems with expensive constant scans.
general:
  debug: false
  performance-reports: false
  monitor-interval: 60
  prefix: "&6[MCOptimizer] &r"
  metrics: false
  auto-detect-conflicts: true
  excluded-plugins: []
  reload-command-enabled: true

chunk:
  enabled: true
  pre-generate-spawn: false
  max-chunks-per-tick: 2
  spawn-chunk-radius: 8
  player-chunk-radius: 6
  ticking-radius: 4
  unload-dynamically: true
  unload-delay: 60
  optimize-world-saving: true
  world-save-interval: 600
  max-view-distance: -1
  prioritize-player-chunks: true
  throttle-chunk-generation: true
  respect-essential-chunks: true

entity:
  enabled: true
  activation-range: 32
  optimize-ai: true
  optimize-pathfinding: true
  max-mobs-per-chunk: 60
  despawn-range: 128
  reduce-mob-spawns: false
  mob-spawn-factor: 1.0
  # Vanilla already merges item entities efficiently. Leave custom scanning off.
  merge-items: false
  smart-xp-merge: false
  max-entities-per-chunk: 80
  max-items-per-chunk: 40
  check-interval-ticks: 200
  item-merge-radius: 2.5
  limit-distant-mob-ai: false
  distant-mob-threshold: 64
  accelerated-item-despawn: false
  farm-protection:
    enabled: true
    protect-villagers: true
    protect-farm-areas: true
    farm-detection-radius: 16
    protected-farm-mobs:
      - VILLAGER
      - IRON_GOLEM
      - ZOMBIE_VILLAGER

mob-culling:
  enabled: false
  interval-ticks: 1200
  intelligent-culling: true
  prioritize-lagging-entities: true
  max-mobs-per-player: 30
  exclude-bosses: true
  exclude-named-mobs: true
  max-mobs-per-world: 1000
  max-per-type:
    zombie: 100
    skeleton: 100
    creeper: 75
    spider: 75
    enderman: 40
    slime: 30
    phantom: 20
  player-protection-radius: 64
  preserve-named-mobs: true
  preserve-tamed-mobs: true
  preserve-equipped-mobs: true
  preserve-boss-mobs: true

redstone:
  enabled: false
  limit-redstone-clock: true
  max-tick-rate: 10
  detect-redstone-clock: true
  max-replace-count: 100
  disable-in-unused-chunks: true
  exempt-radius: 8
  max-updates-per-tick: 100
  disable-when-no-players-nearby: true
  nearby-distance: 64
  limit-piston-chain-length: 12
  smart-hoppers: true

performance-monitor:
  enabled: true
  interval-seconds: 60
  history-size: 30
  track-tps: true
  track-memory: true
  # World-wide scans are intentionally opt-in because they can be expensive.
  track-entities: false
  track-chunks: false
  auto-warn-threshold: true
  tps-warn-threshold: 16.0
  notify-admins: true
  log-to-console: false
  broadcast-warnings: false

compatibility:
  auto-detect-conflicts: true
  excluded-plugins: []
  respect-protection-plugins: true
  use-plugin-hooks: true
  cross-platform:
    geyser-support: true
    floodgate-compatibility: true
    bedrock-optimizations: true

config-analyzer:
  enabled: false
  analyze-server-properties: true
  analyze-bukkit-yml: true
  analyze-spigot-yml: true
  analyze-paper-yml: false
  apply-changes: false
  create-backups: true

memory-leak:
  enabled: false
  check-interval: 30
  detection-threshold: 3
  min-leak-threshold-mb: 50
  create-heap-dump: false
  show-leak-sources: true

entity-distance-limit:
  enabled: false
  full-ai-radius: 32
  reduced-ai-radius: 64
  minimal-ai-radius: 96
  no-ai-radius: 128
  exempt-types:
    - ENDER_DRAGON
    - WITHER
    - VILLAGER
  exempt-named-entities: true

tnt-optimization:
  enabled: false
  max-tnt-per-tick: 10
  batch-physics-updates: true
  max-explosions-per-tick: 5
  dynamic-explosion-scaling: true
  optimize-particles: true

task-optimization:
  enabled: false
  monitor-other-plugins: false
  warn-inefficient: false
  warn-inefficient-tasks: false
  min-task-time-ms: 5
  max-tasks-in-report: 20

network-optimization:
  enabled: false
  batch-entity-packets: false
  prioritize-player-focus: false
  reduce-distant-packets: false
  compression-level: 5
  visibility-percent: 85

afk-detection:
  enabled: false
  timeout-seconds: 300
  reduce-view-distance: true
  afk-view-distance: 4
  notify-players: true
  detect-no-position-change: true

stress-test:
  enabled: false
  require-op: true
  max-test-entities: 500
  max-test-blocks: 1000
  allow-in-production: false
  auto-cleanup: true

performance-reports:
  enabled: false
  auto-generate: false
  interval-minutes: 60
  history-days: 7
  include-plugin-metrics: false
  export-to-web: false
  max-reports: 10

lag-prediction:
  enabled: false
  interval: 60
  data-points: 30
  tps-threshold: 18.0
  cpu-threshold: 0.8
  memory-threshold: 2048
  notify-admins: false
  auto-tune: false
  web-interface:
    enabled: false
    port: 8080
    bind-address: "127.0.0.1"
    access-token: ""

integration-api:
  enabled: true
  log-registrations: false
  allow-custom-optimizers: true
  allow-metrics-access: true
  default-access-level: 1
